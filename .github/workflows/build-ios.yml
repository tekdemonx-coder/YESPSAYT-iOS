name: Build YESPSAYT iOS
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned simulator app
        run: xcodebuild -project YESPSAYT.xcodeproj -scheme YESPSAYT -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
